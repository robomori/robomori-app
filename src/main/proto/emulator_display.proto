syntax = "proto3";
package android.emulation.control;
option java_package = "com.robomori.emulator.protocol";
option java_multiple_files = true;

message Touch {
  int32 x = 1;
  int32 y = 2;
  int32 identifier = 3;
  int32 pressure = 4;
}

message TouchEvent {
  repeated Touch touches = 1;
  int32 display = 2;
}

message KeyboardEvent {
  string text = 5;
}

message ClipData {
  string text = 1;
}

message ParameterValue {
  repeated float data = 1 [packed = true];
}

message PhysicalModelValue {
  enum PhysicalType { POSITION = 0; ROTATION = 1; }
  PhysicalType target = 1;
  ParameterValue value = 3;
  enum Interpolation { SMOOTH = 0; STEP = 1; }
  Interpolation interpolation = 4;
}

message ImageFormat {
  enum ImgFormat { PNG = 0; RGBA8888 = 1; RGB888 = 2; }
  ImgFormat format = 1;
  Rotation rotation = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 display = 5;
  ImageTransport transport = 6;
}

// Where streamed frames go: over gRPC, or written by the emulator into a file the client maps into memory.
message ImageTransport {
  enum TransportChannel { TRANSPORT_CHANNEL_UNSPECIFIED = 0; MMAP = 1; }
  TransportChannel channel = 1;
  // A `file:///` URL the client creates and owns.
  string handle = 2;
}

message Rotation {
  enum SkinRotation { PORTRAIT = 0; LANDSCAPE = 1; REVERSE_PORTRAIT = 2; REVERSE_LANDSCAPE = 3; }
  SkinRotation rotation = 1;
  double xAxis = 2;
  double yAxis = 3;
  double zAxis = 4;
}

message Image {
  ImageFormat format = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestamp_us = 6;
}

message AudioFormat {
  enum SampleFormat { AUD_FMT_U8 = 0; AUD_FMT_S16 = 1; }
  enum Channels { Mono = 0; Stereo = 1; }
  enum DeliveryMode { MODE_UNSPECIFIED = 0; MODE_REAL_TIME = 1; }
  uint64 samplingRate = 1;
  Channels channels = 2;
  SampleFormat format = 3;
  DeliveryMode mode = 4;
}

message AudioPacket {
  AudioFormat format = 1;
  uint64 timestamp = 2;
  bytes audio = 3;
}
